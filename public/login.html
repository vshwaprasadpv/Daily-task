<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Creative Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--bg-primary); }
    .login-bg {
      position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 60% 80%, rgba(6,182,212,0.08) 0%, transparent 50%);
    }
    .login-card {
      position:relative; z-index:1;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo .icon { font-size:48px; margin-bottom:12px; }
    .login-logo h1 { font-size:22px; font-weight:700; color:var(--text-primary); margin:0; }
    .login-logo p  { font-size:13px; color:var(--text-muted); margin:4px 0 0; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
    .form-group input {
      width:100%; padding:12px 16px; border-radius:12px;
      border:1px solid var(--glass-border); background:rgba(255,255,255,0.05);
      color:var(--text-primary); font-size:14px; font-family:inherit;
      transition: border-color 0.2s, box-shadow 0.2s; box-sizing:border-box;
    }
    .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.2); }
    .btn-login {
      width:100%; padding:14px; border:none; border-radius:12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color:#fff; font-size:15px; font-weight:600; cursor:pointer;
      transition: opacity 0.2s, transform 0.1s; margin-top:8px;
    }
    .btn-login:hover { opacity:0.9; } .btn-login:active { transform:scale(0.98); }
    .error-msg { color:var(--danger); font-size:13px; text-align:center; margin-top:12px; min-height:20px; }
    .divider { text-align:center; margin:20px 0; color:var(--text-muted); font-size:12px; position:relative; }
    .divider::before,.divider::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:var(--glass-border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .demo-creds { background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.2); border-radius:10px; padding:12px 16px; }
    .demo-creds p { margin:0; font-size:12px; color:var(--text-muted); }
    .demo-creds strong { color:var(--primary); }
    .spinner { display:none; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🎨</div>
      <h1>Creative Task Manager</h1>
      <p>Sign in to your workspace</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@creative.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button class="btn-login" type="submit" id="loginBtn">
        <span id="btnText">Sign In</span>
        <div class="spinner" id="spinner"></div>
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="divider">Quick Login</div>
    <div class="demo-creds">
      <p>🛡️ <strong>Admin:</strong> admin@creative.com / Admin@123</p>
      <p>🎨 <strong>Designer:</strong> priya@creative.com / Admin@123</p>
      <p>🎬 <strong>Editor:</strong> rahul@creative.com / Admin@123</p>
    </div>
  </div>

  <script>
    if (localStorage.getItem('ctm_token')) window.location.href = '/index.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');
      btn.disabled = true; spinner.style.display = 'block'; btnText.style.display = 'none'; errorMsg.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('ctm_token', data.token);
        localStorage.setItem('ctm_user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        btn.disabled = false; spinner.style.display = 'none'; btnText.style.display = 'block';
      }
    });
  </script>
</body>
</html>
